[project]
name = "stock-task"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altair>=6.2.2",
    "duckdb>=1.5.5",
    "fastapi[standard]>=0.141.1",
    "marimo>=0.23.16",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "sqlglot>=30.17.0",
    "yfinance>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aapl_stock"]

[tool.ruff]
exclude = ["notebooks/testing.py"]

[tool.ruff.lint.per-file-ignores]
"aapl_stock/__init__.py" = ["N999"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
